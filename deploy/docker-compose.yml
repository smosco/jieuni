# 운영 서버(EC2)용. 이미지는 CI가 GHCR에 올리고 서버는 받기만 한다.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jieuni}
      POSTGRES_USER: ${POSTGRES_USER:-jieuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 넣는다}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    # 되돌릴 때는 .env의 BACKEND_TAG를 <sha>로 바꾼다.
    image: ghcr.io/smosco/jieuni-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    # 필수 값에 :?를 붙이지 않는다. 비면 백엔드 시작 검사가 빠진 이름을 모두 로그에 남긴다.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 2GB 서버를 Postgres·Caddy와 나눠 쓴다.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jieuni}
      POSTGRES_USER: ${POSTGRES_USER:-jieuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PHOTO_PUBLIC_BASE_URL: ${PHOTO_PUBLIC_BASE_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      REVALIDATE_URL: ${REVALIDATE_URL:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      start_period: 60s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    # HTTP/3(443/udp)는 열지 않는다. 보안 그룹이 TCP 80·443만 연다.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서가 여기 남는다. 지우면 다시 발급받아 Let's Encrypt 한도를 쓴다.
      - caddy-data:/data
      - caddy-config:/config
    # healthy 조건을 걸지 않는다. 백엔드가 못 떠도 인증서 발급은 먼저 진행된다.
    depends_on:
      - backend
    logging: *logging

  # backup.sh가 run으로만 부른다. 프로필이 있어 up -d에는 끼지 않는다.
  backup:
    image: rclone/rclone:1.75.2
    profiles: [backup]
    environment:
      # 설정은 아래 환경 변수뿐이다. 없는 설정 파일을 찾는 NOTICE가 매일 로그에 남지 않게.
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      RCLONE_CONFIG_R2_ACL: private
      # 버킷 하나에만 쓰는 토큰은 버킷 확인 요청에서 막힌다.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/data
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
