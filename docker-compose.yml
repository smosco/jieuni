services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jieuni}
      POSTGRES_USER: ${POSTGRES_USER:-jieuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 넣는다}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jieuni}
      POSTGRES_USER: ${POSTGRES_USER:-jieuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_PATH: /seed/seed.json
      FIXED_NOW: ${FIXED_NOW:-}
      PHOTO_PUBLIC_BASE_URL: ${PHOTO_PUBLIC_BASE_URL:-}
    volumes:
      - ./seed:/seed:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: ./frontend
      # rewrites 목적지는 빌드 때 결과물에 굳으므로 빌드 인자로도 준다.
      args:
        API_URL: http://backend:8080
        NEXT_PUBLIC_NEWSLETTER_URL: ${NEXT_PUBLIC_NEWSLETTER_URL:-}
    environment:
      API_URL: http://backend:8080
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      start_period: 10s
      retries: 10

volumes:
  db-data:
