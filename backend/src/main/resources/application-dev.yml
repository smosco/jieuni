spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jieuni}
    username: ${POSTGRES_USER:jieuni}
    password: ${POSTGRES_PASSWORD:jieuni}

# 구글 키가 없어도 compose가 뜨게 한다(실제 구글 로그인만 실패).
GOOGLE_CLIENT_ID: unset
GOOGLE_CLIENT_SECRET: unset
FRONTEND_URL: http://localhost:3000
# R2 키가 없어도 뜨게 한다(실제 업로드만 실패).
S3_ENDPOINT: https://unset.r2.cloudflarestorage.com
S3_BUCKET: unset
S3_ACCESS_KEY: unset
S3_SECRET_KEY: unset

jieuni:
  seed-path: ${SEED_PATH:../seed/seed.json}
